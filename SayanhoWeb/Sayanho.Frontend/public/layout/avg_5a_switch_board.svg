<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 16 72 55">
<!-- 5A avg switch board -->
<!-- Wall-mount top view: TOP edge (base line) = wall side, BOTTOM (stem tip) = room side. -->
<!-- Base line on the wall face -->
<line x1="20" y1="22" x2="80" y2="22" stroke="black" stroke-width="5" stroke-linecap="round"/>
<!-- Dome opening toward the room -->
<path d="M 28 22 A 22 22 0 0 0 72 22" fill="none" stroke="black" stroke-width="5" stroke-linecap="round"/>
<!-- Stem dropping from dome toward the room -->
<line x1="50" y1="44" x2="50" y2="65" stroke="black" stroke-width="5" stroke-linecap="round"/>
</svg>
