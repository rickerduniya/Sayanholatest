<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 54">
<!-- Wall-mount top view convention: TOP edge (-y) = wall/base side, BOTTOM (+y) = room/face side. Long axis (x) runs parallel to the wall. -->
<!-- Mounting base on the wall face -->
<rect x="6" y="2" width="88" height="9" fill="#000"/>
<!-- Plate body facing the room -->
<rect x="10" y="15" width="80" height="32" fill="#fff" stroke="#000" stroke-width="4"/>
<text x="50" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="bold" text-anchor="middle">$</text>
</svg>
