<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 50">
<!-- Wall-mount top view convention: TOP edge (-y) = wall/base side, BOTTOM (+y) = room/tube side. Long axis (x) runs parallel to the wall. -->
<!-- Mounting base strip screwed flat to the wall face -->
<rect x="10" y="2" width="110" height="9" fill="#000"/>
<!-- Standoffs from base to end holders -->
<rect x="12" y="11" width="6" height="7" fill="#000"/>
<rect x="112" y="11" width="6" height="7" fill="#000"/>
<!-- End holders -->
<rect x="5" y="18" width="10" height="26" fill="#000"/>
<rect x="115" y="18" width="10" height="26" fill="#000"/>
<!-- Tube (room side) -->
<line x1="15" y1="27" x2="115" y2="27" stroke="#000" stroke-width="3"/>
<line x1="15" y1="36" x2="115" y2="36" stroke="#000" stroke-width="3"/>
</svg>
